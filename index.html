<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник давления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{
  --bg:#E8EEF5; --card:#FFFFFF; --ink:#0F2A44; --muted:#52647A; --line:#D3DCE7;
  --sys:#C0392B; --sys-bg:#FCEDEB; --dia:#1F5FA8; --dia-bg:#E7F0FB; --pul:#2E7D4F; --pul-bg:#E6F4EC;
  --ok:#1E7A45; --okbg:#DCF2E4; --warn:#8A5A00; --warnbg:#FFF0C7; --bad:#B42318; --badbg:#FDE2DF;
  --shadow:0 1px 2px rgba(15,42,68,.06),0 6px 20px rgba(15,42,68,.08);
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}

/* шапка */
header{background:var(--ink);color:#fff;padding:22px 16px 64px;
  background-image:radial-gradient(circle at 85% -20%,rgba(255,255,255,.12) 0,transparent 45%)}
.top{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;flex:none;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center}
header h1{margin:0;font-size:1.55rem;font-weight:900;letter-spacing:-.01em}
#today{margin:2px 0 0;color:#B9C8DA;font-size:.9rem;font-weight:600}

/* вкладки */
nav{max-width:860px;margin:-46px auto 0;padding:0 16px;position:relative}
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:20px;box-shadow:var(--shadow)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;padding:12px 6px;border:0;border-radius:15px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button svg{flex:none}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
section[hidden]{display:none}

.card{background:var(--card);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
h2{font-size:1.2rem;font-weight:900;margin:0 0 14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #F2A900;outline-offset:2px}

/* последнее измерение */
.last{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-left:10px solid var(--line)}
.last.s-ok{border-left-color:var(--ok)} .last.s-warn{border-left-color:#E0A100} .last.s-bad{border-left-color:var(--bad)}
.last .big{font-size:3.2rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.last .big span{color:var(--muted);font-weight:700}
.last .info{flex:1;min-width:180px;color:var(--muted)}
.last .info b{display:block;color:var(--ink);font-size:1.05rem}

/* ввод значений */
.vals-grid{display:grid;gap:14px;margin-bottom:18px}
.val{border-radius:18px;padding:14px 16px}
.val.sys{background:var(--sys-bg);--c:var(--sys)} .val.dia{background:var(--dia-bg);--c:var(--dia)} .val.pul{background:var(--pul-bg);--c:var(--pul)}
.val label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;margin-bottom:8px}
.val label small{color:var(--muted);font-weight:600;font-size:.8rem}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:70px;height:70px;flex:none;font:inherit;font-size:2.2rem;font-weight:800;line-height:1;border:0;background:var(--c);color:#fff;border-radius:50%;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.stepper button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.stepper input{flex:1;min-width:0;height:70px;text-align:center;font:inherit;font-size:2.6rem;font-weight:900;color:var(--c);border:2px solid transparent;border-radius:16px;background:#fff;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.field{margin-bottom:16px}
.field > label{display:block;font-weight:800;margin-bottom:6px}
input[type=datetime-local],input[type=text],textarea,select{width:100%;font:inherit;font-weight:600;border:2px solid var(--line);border-radius:14px;padding:12px;background:#F7F9FC;color:inherit}
input[type=datetime-local]:focus,input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink);background:#fff}
textarea{min-height:64px;resize:vertical}
.two{display:grid;gap:0 14px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}

.primary{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:1.2rem;font-weight:900;padding:18px;border:0;border-radius:18px;background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 4px 0 #061626}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #061626}
.ghost{font:inherit;font-weight:800;padding:12px 18px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.danger{font:inherit;font-weight:800;padding:12px 18px;border:2px solid var(--bad);border-radius:14px;background:#fff;color:var(--bad);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#msg{min-height:1.4em;margin:12px 0 0;font-weight:700;color:var(--ok)}
#msg.err{color:var(--bad)}

.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:.8rem;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)} .b-bad{background:var(--badbg);color:var(--bad)}

/* список записей */
.entry{display:flex;gap:14px;align-items:center;padding:12px 14px;margin-top:8px;border-radius:14px;background:#F5F8FB;border-left:6px solid var(--line)}
.entry.s-ok{border-left-color:var(--ok)} .entry.s-warn{border-left-color:#E0A100} .entry.s-bad{border-left-color:var(--bad)}
.entry .vals{font-size:1.5rem;font-weight:900;white-space:nowrap}
.entry .meta{flex:1;min-width:0;color:var(--muted);font-size:.85rem}
.entry .meta b{color:var(--ink);font-size:.95rem}
.entry .del{border:0;background:none;color:var(--bad);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:underline;padding:8px}
.empty{color:var(--muted);padding:14px 0}
.card-foot{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;font-size:.85rem;font-weight:700}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#F5F8FB;border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-weight:700}
.stat b{font-size:1.45rem;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
th{background:#EEF2F7}
.note{color:var(--muted);font-size:.8rem}
.report-head p{margin:0 0 14px;color:var(--muted)}
.report-head b{color:var(--ink)}

@media (max-width:480px){
  html{font-size:18px}
  .tabs button span{font-size:.9rem}
  .tabs button svg{display:none}
  .stepper button{width:60px;height:60px}
  .stepper input{height:60px}
  .last .big{font-size:2.6rem}
  .entry{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  html{font-size:12px}
  body{background:#fff}
  header,nav,.noprint,#tab-add,#tab-chart{display:none!important}
  #tab-doctor{display:block!important}
  .card{box-shadow:none;padding:0;border-radius:0}
  main{padding:0}
  .stat{border:1px solid #999}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
    </div>
    <div>
      <h1>Дневник давления</h1>
      <p id="today"></p>
    </div>
  </div>
</header>
<nav>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="add" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Записать</span></button>
    <button role="tab" data-tab="chart" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 7-8"/></svg><span>График</span></button>
    <button role="tab" data-tab="doctor" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Для врача</span></button>
  </div>
</nav>
<main>

<section id="tab-add">
  <div class="card last" id="last"></div>

  <div class="card">
    <h2>Новое измерение</h2>
    <div class="vals-grid">
      <div class="val sys"><label for="sys">Верхнее <small>мм рт. ст.</small></label>
        <div class="stepper"><button type="button" data-step="sys" data-d="-1" aria-label="Верхнее: уменьшить на 1">−</button><input id="sys" type="number" inputmode="numeric" min="50" max="300" value="120"><button type="button" data-step="sys" data-d="1" aria-label="Верхнее: увеличить на 1">+</button></div></div>
      <div class="val dia"><label for="dia">Нижнее <small>мм рт. ст.</small></label>
        <div class="stepper"><button type="button" data-step="dia" data-d="-1" aria-label="Нижнее: уменьшить на 1">−</button><input id="dia" type="number" inputmode="numeric" min="30" max="200" value="80"><button type="button" data-step="dia" data-d="1" aria-label="Нижнее: увеличить на 1">+</button></div></div>
      <div class="val pul"><label for="pul">Пульс <small>уд/мин</small></label>
        <div class="stepper"><button type="button" data-step="pul" data-d="-1" aria-label="Пульс: уменьшить на 1">−</button><input id="pul" type="number" inputmode="numeric" min="30" max="220" value="70"><button type="button" data-step="pul" data-d="1" aria-label="Пульс: увеличить на 1">+</button></div></div>
    </div>
    <div class="two">
      <div class="field"><label for="when">Дата и время</label><input id="when" type="datetime-local"></div>
      <div class="field"><label for="note">Заметка</label><textarea id="note" rows="1" placeholder="После завтрака, принял таблетку"></textarea></div>
    </div>
    <button class="primary" id="save" type="button">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      Сохранить запись</button>
    <p id="msg" role="status"></p>
  </div>

  <div class="card">
    <h2>Последние записи</h2>
    <div id="recent"></div>
    <div class="card-foot row" id="clearRow"><button class="danger" type="button" data-clear>Очистить дневник</button></div>
  </div>
</section>

<section id="tab-chart" hidden>
  <div class="card">
    <h2>Изменение давления</h2>
    <div class="field"><label for="period">Период</label>
      <select id="period"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="0">Всё время</option></select></div>
    <div id="chart"></div>
  </div>
</section>

<section id="tab-doctor" hidden>
  <div class="card noprint">
    <h2>Отчёт для врача</h2>
    <div class="two">
      <div class="field"><label for="pname">Имя пациента</label><input id="pname" type="text" placeholder="Фамилия Имя Отчество"></div>
      <div class="field"><label for="dperiod">Период</label>
        <select id="dperiod"><option value="7">7 дней</option><option value="14">14 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="0">Всё время</option></select></div>
    </div>
    <div class="row"><button class="ghost" id="print" type="button">Печать / сохранить в PDF</button><button class="ghost" id="csv" type="button">Скачать таблицу (CSV)</button></div>
  </div>
  <div class="card" id="report"></div>
</section>

</main>
<script>
(function(){
  var KEY='bp-diary-v1', NAMEKEY='bp-diary-name';
  var $=function(s){return document.querySelector(s)};
  var store={
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  var data=store.get(KEY,[]);
  var RANGE={sys:[50,300],dia:[30,200],pul:[30,220]};
  var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WEEK=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  function pad(n){return n<10?'0'+n:''+n}
  function localInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
  function fmt(t){var d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
  function fmtShort(t){var d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)}
  function human(t){
    var d=new Date(t), now=new Date(), time=pad(d.getHours())+':'+pad(d.getMinutes());
    var day=new Date(d.getFullYear(),d.getMonth(),d.getDate()), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var diff=Math.round((today-day)/86400000);
    if(diff===0)return 'сегодня в '+time;
    if(diff===1)return 'вчера в '+time;
    return d.getDate()+' '+MONTHS[d.getMonth()]+' в '+time;
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function cls(e){
    if(e.sys>=140||e.dia>=90)return ['Высокое','b-bad','s-bad'];
    if(e.sys>=130||e.dia>=85)return ['Повышенное','b-warn','s-warn'];
    return ['Норма','b-ok','s-ok'];
  }
  function persist(){data.sort(function(a,b){return a.t-b.t});store.set(KEY,data)}

  var n=new Date();
  $('#today').textContent='Сегодня '+n.getDate()+' '+MONTHS[n.getMonth()]+', '+WEEK[n.getDay()];

  /* шаг 1 мм рт. ст. */
  function clamp(id,v){var r=RANGE[id];return Math.max(r[0],Math.min(r[1],v))}
  document.querySelectorAll('[data-step]').forEach(function(b){
    b.addEventListener('click',function(){
      var el=$('#'+b.dataset.step), v=parseInt(el.value,10);
      if(isNaN(v))v=120;
      el.value=clamp(b.dataset.step,v+parseInt(b.dataset.d,10));
    });
  });
  ['sys','dia','pul'].forEach(function(id){
    $('#'+id).addEventListener('keydown',function(e){
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();
        var v=parseInt(this.value,10)||0;this.value=clamp(id,v+(e.key==='ArrowUp'?1:-1))}
    });
  });

  function resetWhen(){$('#when').value=localInput(new Date())}
  resetWhen();

  function say(text,err){var m=$('#msg');m.textContent=text;m.className=err?'err':''}

  $('#save').addEventListener('click',function(){
    var s=parseInt($('#sys').value,10), d=parseInt($('#dia').value,10), p=parseInt($('#pul').value,10);
    var t=new Date($('#when').value).getTime();
    if(isNaN(s)||isNaN(d)||isNaN(p)||s<RANGE.sys[0]||s>RANGE.sys[1]||d<RANGE.dia[0]||d>RANGE.dia[1]||p<RANGE.pul[0]||p>RANGE.pul[1]){
      say('Проверьте числа: верхнее 50–300, нижнее 30–200, пульс 30–220.',true);return}
    if(d>=s){say('Нижнее давление должно быть меньше верхнего.',true);return}
    if(isNaN(t)){say('Укажите дату и время записи.',true);return}
    data.push({id:Date.now()+Math.random(),t:t,sys:s,dia:d,pul:p,note:$('#note').value.trim()});
    persist();
    $('#note').value='';resetWhen();
    say('Сохранено: '+s+'/'+d+', пульс '+p+'.');
    renderAll();
  });

  function del(id){
    if(!confirm('Удалить эту запись?'))return;
    data=data.filter(function(e){return e.id!==id});persist();renderAll();
  }
  document.querySelectorAll('[data-clear]').forEach(function(b){
    b.addEventListener('click',function(){
      if(!data.length)return;
      if(!confirm('Удалить все записи ('+data.length+')? Вернуть их будет нельзя.'))return;
      data=[];persist();say('Дневник очищен.');renderAll();
    });
  });

  function renderLast(){
    var box=$('#last');
    if(!data.length){box.className='card last';
      box.innerHTML='<div class="info"><b>Дневник пока пуст</b>Измерьте давление и сохраните первую запись ниже.</div>';return}
    var e=data[data.length-1], c=cls(e);
    box.className='card last '+c[2];
    box.innerHTML='<div class="big">'+e.sys+'<span>/</span>'+e.dia+'</div>'+
      '<div class="info"><b>Последнее измерение</b>'+human(e.t)+' · пульс '+e.pul+'</div>'+
      '<span class="badge '+c[1]+'">'+c[0]+'</span>';
  }

  function renderRecent(){
    var box=$('#recent');
    $('#clearRow').hidden=!data.length;
    if(!data.length){box.innerHTML='<div class="empty">Записей нет.</div>';return}
    var list=data.slice().reverse().slice(0,8);
    box.innerHTML=list.map(function(e){
      var c=cls(e);
      return '<div class="entry '+c[2]+'"><div class="vals">'+e.sys+'/'+e.dia+'</div><div class="meta"><b>'+fmt(e.t)+'</b> · пульс '+e.pul+
        (e.note?'<br>'+esc(e.note):'')+'</div><span class="badge '+c[1]+'">'+c[0]+'</span>'+
        '<button class="del" data-del="'+e.id+'" type="button">Удалить</button></div>';
    }).join('');
    box.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click',function(){del(parseFloat(b.dataset.del))});
    });
  }

  function inPeriod(days){
    if(!days)return data.slice();
    var from=Date.now()-days*86400000;
    return data.filter(function(e){return e.t>=from});
  }

  /* SVG-график */
  function chartSVG(list){
    if(!list.length)return '<div class="empty">За выбранный период записей нет.</div>';
    var W=800,H=380,L=58,R=18,T=18,B=48;
    var vals=[];list.forEach(function(e){vals.push(e.sys,e.dia,e.pul)});
    var lo=Math.floor((Math.min.apply(null,vals)-10)/10)*10, hi=Math.ceil((Math.max.apply(null,vals)+10)/10)*10;
    var t0=list[0].t, t1=list[list.length-1].t, span=t1-t0;
    function X(t){return span?L+(t-t0)/span*(W-L-R):(L+(W-L-R)/2)}
    function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B)}
    var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График давления и пульса">';
    s+='<defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C0392B" stop-opacity=".18"/><stop offset="1" stop-color="#C0392B" stop-opacity="0"/></linearGradient></defs>';
    var step=(hi-lo)>120?20:10;
    for(var v=lo;v<=hi;v+=step){
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#E1E7EF" stroke-width="1"/>'+
         '<text x="'+(L-8)+'" y="'+(Y(v)+5)+'" text-anchor="end" font-size="15" font-weight="700" fill="#52647A">'+v+'</text>';
    }
    [[140,'#C0392B'],[90,'#1F5FA8']].forEach(function(r){
      if(r[0]>lo&&r[0]<hi)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(r[0])+'" y2="'+Y(r[0])+'" stroke="'+r[1]+'" stroke-width="1.5" stroke-dasharray="2 6" opacity=".8"/>';
    });
    var n=Math.min(list.length,6);
    for(var i=0;i<n;i++){
      var t=span?t0+span*i/(n-1||1):t0;
      s+='<text x="'+X(t)+'" y="'+(H-18)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#52647A">'+fmtShort(t)+'</text>';
    }
    if(list.length>1){
      var area='M'+X(t0).toFixed(1)+','+Y(lo).toFixed(1)+list.map(function(e){return ' L'+X(e.t).toFixed(1)+','+Y(e.sys).toFixed(1)}).join('')+' L'+X(t1).toFixed(1)+','+Y(lo).toFixed(1)+'Z';
      s+='<path d="'+area+'" fill="url(#gs)"/>';
    }
    function line(key,color,dash){
      var pts=list.map(function(e){return X(e.t).toFixed(1)+','+Y(e[key]).toFixed(1)}).join(' ');
      var out='<polyline fill="none" stroke="'+color+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="9 6"':'')+' points="'+pts+'"/>';
      list.forEach(function(e){out+='<circle cx="'+X(e.t).toFixed(1)+'" cy="'+Y(e[key]).toFixed(1)+'" r="'+(list.length>40?3:5.5)+'" fill="#fff" stroke="'+color+'" stroke-width="3"><title>'+fmt(e.t)+': '+e.sys+'/'+e.dia+', пульс '+e.pul+'</title></circle>'});
      return out;
    }
    s+=line('pul','#2E7D4F',true)+line('dia','#1F5FA8')+line('sys','#C0392B');
    s+='<text x="'+L+'" y="'+(H-2)+'" font-size="13" fill="#52647A">мм рт. ст.</text></svg>';
    s+='<div class="legend"><span><i style="background:#C0392B"></i>Верхнее</span><span><i style="background:#1F5FA8"></i>Нижнее</span>'+
       '<span><i style="background:repeating-linear-gradient(90deg,#2E7D4F 0 9px,transparent 9px 14px)"></i>Пульс</span>'+
       '<span class="note">Точечные линии: 140 и 90 — порог повышенного давления</span></div>';
    return s;
  }

  function renderChart(){$('#chart').innerHTML=chartSVG(inPeriod(parseInt($('#period').value,10)))}

  function avg(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):'—'}
  function mm(a){return a.length?Math.min.apply(null,a)+'–'+Math.max.apply(null,a):'—'}

  function renderReport(){
    var days=parseInt($('#dperiod').value,10), list=inPeriod(days);
    var name=$('#pname').value.trim();
    var S=list.map(function(e){return e.sys}), D=list.map(function(e){return e.dia}), P=list.map(function(e){return e.pul});
    var high=list.filter(function(e){return cls(e)[1]==='b-bad'}).length;
    var per=list.length?fmt(list[0].t).slice(0,10)+' — '+fmt(list[list.length-1].t).slice(0,10):'—';
    var h='<div class="report-head"><h2>Дневник артериального давления</h2>'+
      '<p><b>Пациент:</b> '+(name?esc(name):'не указано')+'<br><b>Период:</b> '+per+'<br><b>Составлен:</b> '+fmt(Date.now())+'</p></div>';
    if(!list.length){$('#report').innerHTML=h+'<div class="empty">За выбранный период записей нет.</div>';return}
    h+='<div class="stats">'+
      '<div class="stat"><small>Измерений</small><b>'+list.length+'</b></div>'+
      '<div class="stat"><small>Среднее давление</small><b>'+avg(S)+'/'+avg(D)+'</b></div>'+
      '<div class="stat"><small>Диапазон верхнего</small><b>'+mm(S)+'</b></div>'+
      '<div class="stat"><small>Диапазон нижнего</small><b>'+mm(D)+'</b></div>'+
      '<div class="stat"><small>Средний пульс</small><b>'+avg(P)+'</b></div>'+
      '<div class="stat"><small>Высокое (≥140/90)</small><b>'+high+' из '+list.length+'</b></div></div>';
    h+=chartSVG(list);
    h+='<h2 style="margin-top:18px">Все измерения</h2><table><thead><tr><th>Дата и время</th><th>Верхнее</th><th>Нижнее</th><th>Пульс</th><th>Оценка</th><th>Заметка</th></tr></thead><tbody>'+
      list.map(function(e){return '<tr><td>'+fmt(e.t)+'</td><td>'+e.sys+'</td><td>'+e.dia+'</td><td>'+e.pul+'</td><td>'+cls(e)[0]+'</td><td>'+esc(e.note)+'</td></tr>'}).join('')+
      '</tbody></table><p class="note">Оценка: норма — ниже 130/85; повышенное — от 130/85; высокое — от 140/90. Это справка, не диагноз.</p>';
    $('#report').innerHTML=h;
  }

  $('#print').addEventListener('click',function(){window.print()});
  $('#csv').addEventListener('click',function(){
    var list=inPeriod(parseInt($('#dperiod').value,10));
    var rows=['Дата;Время;Верхнее;Нижнее;Пульс;Заметка'].concat(list.map(function(e){
      var d=new Date(e.t);
      return [pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(),pad(d.getHours())+':'+pad(d.getMinutes()),e.sys,e.dia,e.pul,'"'+e.note.replace(/"/g,'""')+'"'].join(';');
    }));
    var blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='davlenie.csv';
    document.body.appendChild(a);a.click();a.remove();
  });

  $('#pname').value=store.get(NAMEKEY,'');
  $('#pname').addEventListener('input',function(){store.set(NAMEKEY,this.value);renderReport()});
  $('#period').addEventListener('change',renderChart);
  $('#dperiod').addEventListener('change',renderReport);

  function renderAll(){renderLast();renderRecent();renderChart();renderReport()}

  document.querySelectorAll('.tabs [data-tab]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabs [data-tab]').forEach(function(x){x.setAttribute('aria-selected',x===b)});
      ['add','chart','doctor'].forEach(function(n){$('#tab-'+n).hidden=(n!==b.dataset.tab)});
      window.scrollTo(0,0);
    });
  });

  renderAll();
})();
</script>
</body>
</html>
